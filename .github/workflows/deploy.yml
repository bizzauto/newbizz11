name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      # HARD GATE (P0-3): was "|| echo non-blocking" â€” type errors could reach
      # production. Full typecheck (client + server) now fails the workflow.
      # 4GB heap: tsc OOMs on GH runners at default ~2GB with this codebase size.
      - name: TypeScript type check (client + server)
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Frontend build check
        run: npx vite build 2>&1 | tail -5

  regression-gate:
    name: Guardian Regression Gate
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      # P0-4: baseline-delta regression gate. Blocks deploy when new test
      # failures appear vs the committed baseline (qa/evidence/last-good-regression.json).
      # First run without a baseline establishes it (exit 0) and the artifact
      # must be committed in the same PR to lock the gate.
      - name: Run regression gate
        run: node scripts/guardian/regression-guardian.cjs
        env:
          # jest worker OOM protection on 7GB GH runners
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-evidence
          path: qa/evidence/last-good-regression.json
          if-no-files-found: ignore

  deploy:
    name: Deploy to Coolify
    needs: [test, regression-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl -s -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"force": true}' \
            --max-time 60

      - name: Wait for deployment & check health
        run: |
          echo "Waiting 30s for deployment to start..."
          sleep 30
          echo "Deployment triggered via Coolify webhook"
          echo "Monitor at: http://87.76.169.6:8000"

  rollback:
    name: Rollback (on failure)
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Trigger Coolify rollback
        run: |
          curl -s -X POST "${{ secrets.COOLIFY_ROLLBACK_WEBHOOK }}" \
            --max-time 30 || echo "Rollback webhook not configured"
          echo "Rollback triggered for failed deployment"
